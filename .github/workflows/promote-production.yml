name: Promote dev image to production

on:
  workflow_dispatch:

concurrency:
  group: production-promotion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    name: Promote currently deployed dev image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://design-sync-production.onrender.com
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID || 'tea-db4sthp42hec73esmmn0' }}
      RENDER_REGISTRY_CREDENTIAL_NAME: ${{ vars.RENDER_REGISTRY_CREDENTIAL_NAME || 'design-sync-ecr' }}
      RENDER_DEV_SERVICE_ID: srv-db67p6vavr4c739uo070
      RENDER_PRODUCTION_SERVICE_ID: srv-db687ip42hec73b9ghg0

    steps:
      - name: Install Render CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/render-oss/cli/main/bin/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/render" --version

      - name: Resolve currently deployed dev image
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY" || {
            echo "RENDER_API_KEY is not configured." >&2
            exit 1
          }
          test -n "$AWS_ROLE_ARN" || {
            echo "Repository variable AWS_ROLE_ARN is not configured." >&2
            exit 1
          }

          dev_deploys="$(render deploys list "$RENDER_DEV_SERVICE_ID" -o json)"
          image_url="$(jq -r '[.[] | select(.status == "live") | (.image.ref // .image.url // empty)] | .[0] // empty' <<< "$dev_deploys")"

          if [ -z "$image_url" ]; then
            echo "The dev service has no live image-backed deployment yet. Run Build image and deploy dev first." >&2
            exit 1
          fi
          if [[ "$image_url" != *.amazonaws.com/* ]]; then
            echo "The live dev deployment is not an ECR image: $image_url" >&2
            exit 1
          fi

          echo "image=$image_url" >> "$GITHUB_OUTPUT"
          echo "Promoting currently deployed dev image: $image_url"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Refresh Render ECR credential
        shell: bash
        run: |
          set -euo pipefail
          export AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          export ECR_PASSWORD="$(aws ecr get-login-password --region "$AWS_REGION")"
          credential_id="$(bash infra/render-image.sh update-credential)"
          echo "RENDER_REGISTRY_CREDENTIAL_ID=$credential_id" >> "$GITHUB_ENV"

      - name: Configure production as an image-backed service
        env:
          IMAGE_URL: ${{ steps.source.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          bash infra/render-image.sh configure-service \
            "$RENDER_PRODUCTION_SERVICE_ID" \
            "$IMAGE_URL" \
            "$RENDER_REGISTRY_CREDENTIAL_ID" \
            off

      - name: Pull and serve the dev image on production
        env:
          IMAGE_URL: ${{ steps.source.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          render deploys create "$RENDER_PRODUCTION_SERVICE_ID" \
            --image "$IMAGE_URL" \
            --wait \
            --confirm \
            -o json

      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-max-time 180 \
            https://design-sync-production.onrender.com/openapi.json \
            >/dev/null
          echo "Production is healthy at https://design-sync-production.onrender.com"
